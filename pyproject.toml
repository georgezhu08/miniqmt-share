[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miniqmt-share"
version = "1.1.3+miniqmt.2"
description = "Xtreme Quant Share - eXtreme transparent sharing proxy for XtQuant on macOS/Linux"
readme = "docs/MINIQMT_SHARE.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [
    {name = "Jason Hu", email = "63170682@qq.com"}
]
keywords = [
    "xtquant",
    "rpyc", 
    "remote",
    "proxy",
    "quant",
    "stock",
    "trading",
    "qmt",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Networking",
]
dependencies = [
    "rpyc>=6.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pandas>=2.0",
    "black>=23.0",
    "flake8>=6.0",
]

[project.scripts]
miniqmt-share-server = "miniqmt_share.server:main"
miniqmt-xtdata = "miniqmt_share.tools.xtdata:main"
miniqmt-xttrader = "miniqmt_share.tools.xttrader:main"

[project.urls]
Homepage = "https://github.com/georgezhu08/miniqmt-share"
Documentation = "https://github.com/georgezhu08/miniqmt-share/blob/main/docs/MINIQMT_SHARE.md"
Repository = "https://github.com/georgezhu08/miniqmt-share"
Issues = "https://github.com/georgezhu08/miniqmt-share/issues"
Upstream = "https://github.com/jasonhu/xqshare"

[tool.setuptools.packages.find]
where = ["."]
include = ["miniqmt_share*"]

[tool.setuptools.package-data]
"*" = ["*.md", "*.txt"]
